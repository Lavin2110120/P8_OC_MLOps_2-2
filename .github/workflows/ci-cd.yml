name: CI/CD Pipeline - FastAPI Render

on:
  push:
    branches: [ main, test ]

jobs:
  # 1. Tests unitaires, d'intégration (PostgreSQL) et de latence
  test:
    name: Run Pytest (Unit & Performance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Run Pytest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pytest

  # 2. Validation de l'image Docker & Smoke Test du conteneur
  docker-check:
    name: Build & Test Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t scoring-api:test .

      - name: Run Container & Smoke Test
        env:
          DATABASE_URL: postgresql+asyncpg://p8_db_ba6y_user:xPkdpcurgzpMopfxc8JRAnvEspmurHib@dpg-d9q6o5lbedkc73b78mtg-a.frankfurt-postgres.render.com/p8_db_ba6y?ssl=require
        run: |
          # Transmission de la variable d'environnement au conteneur avec -e
          docker run -d --name test-api -p 8000:8000 -e DATABASE_URL="$DATABASE_URL" scoring-api:test
          
          # Pause pour laisser le temps à Uvicorn / ONNX de démarrer
          sleep 5
          
          # Test de santé (Smoke test) sur le conteneur en cours d'exécution
          curl --fail http://localhost:8000/health || (docker logs test-api && exit 1)

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop test-api || true
          docker rm test-api || true

  # 3. Déploiement automatique sur Render
  deploy:
    name: Trigger Render Deployment
    needs: docker-check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"