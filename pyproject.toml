[project]
name = "projet-morel"
version = "0.1.0"
description = "Scoring Solution Client - MLOps, partie 2 - Projet 8"
readme = "README.md"
requires-python = ">=3.10, <3.13"

dependencies = [
    # Data Processing & Analysis
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    
    # Data Visualization
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    
    # Machine Learning & Pipelines
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "category-encoders>=2.6.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    
    # Optimisation & Runtime (Etape 4)
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "skl2onnx>=1.17.0",
    "onnxmltools>=1.16.0",
    
    # Experiment Tracking & MLOps
    "mlflow>=2.10.0",
    "sqlalchemy>=2.0.0",
    "evidently>=0.6.0,<0.7.0",

    # API Web (FastAPI) & Serveur
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn[standard]>=0.27.0",
    
    # Testing, Profiling & Client HTTP
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",

    # Notebooks & File Utilities
    "ipykernel>=6.29.0",
    "Jinja2>=3.1.0",
    "openpyxl>=3.1.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"