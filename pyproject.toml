[project]
name = "projet-morel"
version = "0.1.0"
description = "Scoring Solution Client - MLOps, partie 2 - Projet 8"
readme = "README.md"
requires-python = ">=3.10, <3.13"

dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn[standard]>=0.27.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "onnxruntime>=1.18.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
    "evidently>=0.6.0,<0.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "mlflow>=2.10.0",
    "onnx>=1.16.0",
    "skl2onnx>=1.17.0",
    "onnxmltools>=1.16.0",
    "imbalanced-learn>=0.12.0",
    "category-encoders>=2.6.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "truststore>=0.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "performance: marqueurs pour les tests de performance de latence et charge",
    "real_db: tests nécessitant une connexion réelle à PostgreSQL",
    "integration: tests d'intégration",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 70

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]